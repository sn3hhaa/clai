name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest · evaluation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - name: Install pinned dependencies (CPU-only PyTorch)
        run: |
          uv venv .venv --python 3.12
          uv pip sync requirements-ci.txt --python .venv/bin/python --torch-backend cpu
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-msmarco-v1
      - run: .venv/bin/python -m ruff check app tests scripts
      - run: .venv/bin/python -m ruff format --check app tests scripts
      - run: .venv/bin/python -m mypy app
      - run: .venv/bin/python -m pytest
      - name: Evaluation (extractive, no API keys)
        run: .venv/bin/python -m scripts.evaluate --out /tmp/eval.json

  frontend:
    name: Frontend (eslint · tsc · vitest · build · playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Static export (GitHub Pages build)
        run: npm run export:pages
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /clai
      - name: Verify the export under /clai
        run: |
          node scripts/serve-static.mjs 4173 /clai &
          npx playwright install --with-deps chromium
          sleep 2
          node scripts/check-static.mjs http://localhost:4173/clai
        env:
          CI: "true"
      - name: End-to-end tests (desktop + mobile, API mocked)
        run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uvx --python 3.12 --with-requirements docs/requirements.txt mkdocs build --strict

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production dependencies, high and above)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: astral-sh/setup-uv@v7
      - name: pip-audit (runtime requirements)
        run: uvx pip-audit --requirement backend/requirements.txt --disable-pip --no-deps --progress-spinner off
