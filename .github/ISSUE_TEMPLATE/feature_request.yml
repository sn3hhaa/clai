name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: It works with free tiers or local models (no paid service is required)
        - label: It runs without Docker
