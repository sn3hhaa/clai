# Tool configuration only. Dependencies are pinned in requirements*.txt (compiled with uv).
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # typographic quotes/dashes are intentional in text

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/", "data/"]
